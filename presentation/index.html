<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giao tuyến khối trụ 3D</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <button class="btn panel-toggle" id="btn-toggle">Ẩn bảng</button>

  <aside class="control-panel" id="panel">
    <h1>Giao tuyến khối trụ 3D</h1>
    <p class="subtitle">Hình học họa hình & Vẽ kỹ thuật</p>

    <section class="section">
      <h2>Chế độ hiển thị</h2>
      <div class="btn-row">
        <button class="btn active" data-mode="solid">Khối đặc</button>
        <button class="btn" data-mode="xray">Xuyên thấu</button>
        <button class="btn" data-mode="wireframe">Khung dây</button>
      </div>
    </section>

    <section class="section">
      <h2>Thông số hình học</h2>
      <div class="slider-group">
        <div class="slider-label"><span>Bán kính trụ đứng (R₁)</span><strong id="val-r1">2.0</strong></div>
        <input type="range" id="slider-r1" min="0.8" max="3.5" step="0.1" value="2.0">
      </div>
      <div class="slider-group">
        <div class="slider-label"><span>Bán kính trụ ngang (R₂)</span><strong id="val-r2">1.5</strong></div>
        <input type="range" id="slider-r2" min="0.5" max="3.5" step="0.1" value="1.5">
      </div>
      <div class="slider-group">
        <div class="slider-label"><span>Độ lệch tâm trục X (e)</span><strong id="val-offset">0.0</strong></div>
        <input type="range" id="slider-offset" min="-2.5" max="2.5" step="0.1" value="0.0">
      </div>
    </section>

    <section class="section">
      <h2>Điểm giao đường sinh với mặt trụ</h2>
      <div class="slider-group">
        <div class="slider-label"><span>Góc đường sinh (θ)</span><strong id="val-theta">45°</strong></div>
        <input type="range" id="slider-theta" min="0" max="360" step="1" value="45">
      </div>
      <button class="btn btn-full" id="btn-point">Hiện điểm giao</button>
    </section>

    <section class="section">
      <h2>Góc nhìn chuẩn</h2>
      <div class="btn-grid">
        <button class="btn view-btn" data-view="front">Mặt trước</button>
        <button class="btn view-btn" data-view="top">Trên xuống</button>
        <button class="btn view-btn" data-view="side">Mặt bên</button>
        <button class="btn view-btn" data-view="iso">Góc nhìn 3D</button>
      </div>
    </section>

    <section class="section">
      <h2>Hiệu ứng</h2>
      <div class="btn-row">
        <button class="btn" id="btn-rotate">Xoay tự động</button>
        <button class="btn" id="btn-pulse">Hiệu ứng thở</button>
      </div>
      <button class="btn btn-full btn-draw" id="btn-draw">Vẽ giao tuyến</button>
    </section>

    <button class="btn btn-full btn-reset" id="btn-reset">Đặt lại mặc định</button>

    <div class="legend">
      <span class="legend-item"><i class="dot c1"></i>Trụ đứng</span>
      <span class="legend-item"><i class="dot c2"></i>Trụ ngang</span>
      <span class="legend-item"><i class="dot intersect"></i>Giao tuyến</span>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
